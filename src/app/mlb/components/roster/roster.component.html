<sports-roster-list [roster]="roster"
  [isLoading]="isLoading"
  (addRow)="addRow()"
  (editRow)="editRow($event)"
  (deleteRow)="deleteRow($event)">
</sports-roster-list>

<sports-roster-detail [mlbForm]="mlbForm"
  [display]="display"
  [isAdding]="isAdding"
  [isSubmitted]="isSubmitted"
  [errMessage]="errMessage"
  (hideDialog)="hideDialog()"
  (save)="save()"
  (add)="add()">
</sports-roster-detail>
